name: Build and Release

on:
  push:
    branches:
      - DariaOS-5.0-20241205
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller tqdm

      - name: Build Windows executable
        run: |
          pyinstaller bond1_os5_bootstrap.spec

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bond1DariaOS5Bootstrap-Windows
          path: dist/Bond1DariaOS5Bootstrap.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller tqdm

      - name: Build Linux executable
        run: |
          pyinstaller bond1_os5_bootstrap.spec

      - name: Make executable
        run: chmod +x dist/Bond1DariaOS5Bootstrap

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bond1DariaOS5Bootstrap-Linux
          path: dist/Bond1DariaOS5Bootstrap

  create-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Bond1DariaOS5Bootstrap-Windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: Bond1DariaOS5Bootstrap-Linux

      - name: Create Version Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Bond1DariaOS5Bootstrap.exe
            Bond1DariaOS5Bootstrap
          draft: false
          prerelease: false
          generate_release_notes: true