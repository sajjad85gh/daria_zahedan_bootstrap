name: Build and Release

on:
  push:
    branches:
      - bond1-downgrade-os5
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller tqdm

      - name: Build Windows executable
        run: |
          pyinstaller daria_bond_flash.spec

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DariaBond1Flash-Windows
          path: dist/DariaBond1Flash.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller tqdm

      - name: Build Linux executable
        run: |
          pyinstaller daria_bond_flash.spec

      - name: Make executable
        run: chmod +x dist/DariaBond1Flash

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: DariaBond1Flash-Linux
          path: dist/DariaBond1Flash

  create-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: DariaBond1Flash-Windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: DariaBond1Flash-Linux

      - name: Create/Update Nightly Release
        if: github.ref == 'refs/heads/bond1-downgrade-os5'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly
          name: Nightly Build
          files: |
            DariaBond1Flash.exe
            DariaBond1Flash
          draft: false
          prerelease: true
          generate_release_notes: false
          body: |
            Automated nightly build from the latest commit.
            
            **⚠️ Warning:** This is a development build and may be unstable.
            
            Latest commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Version Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            DariaBond1Flash.exe
            DariaBond1Flash
          draft: false
          prerelease: false
          generate_release_notes: true